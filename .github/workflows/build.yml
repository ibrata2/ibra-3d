name: Build Windows installer

# كل دفع على main يبني ملف التنصيب وينشره بالـ Releases باسم v<version> من package.json.
# electron-builder يسوي الـ tag والـ release تلقائياً. إذا نفس الإصدار منشور سابقاً ما يعيد الرفع،
# فحتى تطلع نسخة جديدة غيّر "version" بـ package.json.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build NSIS installer and publish to Releases
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-3D-Setup
          path: dist/*.exe
