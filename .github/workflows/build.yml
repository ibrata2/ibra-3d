name: Build Windows installer

# كل دفع على main يبني ملف التنصيب وينشره بالـ Releases باسم v<version> من package.json.
# electron-builder يسوي الـ tag والـ release تلقائياً. إذا نفس الإصدار منشور سابقاً ما يعيد الرفع،
# فحتى تطلع نسخة جديدة غيّر "version" بـ package.json.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build NSIS installer
        run: npx electron-builder --win nsis --publish never

      # النشر بخطوة وحدة: release واحد لكل إصدار بيه EXE و latest.yml و blockmap.
      # إذا نفس الإصدار منشور سابقاً (أو مكرر من محاولة قديمة) ينحذف وينعاد نشره نظيف.
      - name: Publish release v<version>
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          for id in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq ".[] | select(.tag_name==\"$V\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          shopt -s nullglob
          files=(dist/*.exe dist/*.blockmap dist/latest.yml)
          echo "assets: ${files[*]}"
          gh release create "$V" "${files[@]}" \
            --target "${{ github.sha }}" --title "IBRA 3D $V" \
            --notes "IBRA 3D $V — تحويل الصور الى مجسمات GLB مجاناً. حمّل IBRA-3D-Setup-${V#v}.exe ونصّبه."

      - uses: actions/upload-artifact@v4
        with:
          name: IBRA-3D-Setup
          path: dist/*.exe
